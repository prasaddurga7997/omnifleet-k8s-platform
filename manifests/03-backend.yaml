apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-backend
  namespace: omni-prod
  labels:
    app: omni
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omni
      tier: backend
  template:
    metadata:
      labels:
        app: omni
        tier: backend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: size
                    operator: In
                    values:
                      - Large
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z -v -w 2 redis-db-svc 6379; do echo waiting for db; sleep 2; done']
      containers:
        - name: backend-app
          image: nginx:alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-routing
                  key: DATABASE_HOST
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: omni-backend-svc
  namespace: omni-prod
spec:
  type: ClusterIP
  selector:
    app: omni
    tier: backend
  ports:
    - port: 80
      targetPort: 80