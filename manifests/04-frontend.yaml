apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-frontend
  namespace: omni-prod
  labels:
    app: omni
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omni
      tier: frontend
  template:
    metadata:
      labels:
        app: omni
        tier: frontend
    spec:
      containers:
        - name: omni-frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: omni-frontend-svc
  namespace: omni-prod
spec:
  type: NodePort
  selector:
    app: omni
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080